name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  verify:
    name: Build and test (mvn verify, incl. Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: mvn verify
        run: mvn -B verify

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/*"
          retention-days: 7

  docker-build:
    name: Build Docker images
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ledger-service image
        run: docker build -f ledger-service/Dockerfile -t ledgerguard/ledger-service:${{ github.sha }} .

      - name: Build notification-service image
        run: docker build -f notification-service/Dockerfile -t ledgerguard/notification-service:${{ github.sha }} .
