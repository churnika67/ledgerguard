spring:
  application:
    name: ledger-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledgerguard}
    username: ${DB_USERNAME:ledgerguard}
    password: ${DB_PASSWORD:ledgerguard}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
  graphql:
    graphiql:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        retries: 10
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

server:
  port: ${SERVER_PORT:8080}

ledger:
  locking: ${LEDGER_LOCKING:OPTIMISTIC}
  kafka:
    enabled: ${KAFKA_ENABLED:true}
  cache:
    enabled: ${REDIS_ENABLED:true}
    accounts-ttl-seconds: 60
  optimistic-retry:
    max-attempts: 10
    base-delay-ms: 5
    max-delay-ms: 200
  outbox:
    publish-topic: ledger.transfers
    poll-interval-ms: 500
    batch-size: 100
  statements:
    bucket: ${STATEMENTS_BUCKET:ledgerguard-statements}

jwt:
  secret: ${JWT_SECRET:ledgerguard-demo-secret-key-change-me-please-32bytes-min}
  expiration-minutes: 60

web:
  cors-allowed-origins: ${WEB_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    com.ledgerguard: INFO
